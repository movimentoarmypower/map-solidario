<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAP Solidário · Mobilização, Apoio e Proteção</title>
<meta name="description" content="MAP Solidário: mobilização humanitária para as cidades atingidas no Rio Grande do Sul. Seja voluntário, doe e acompanhe.">
<meta property="og:title" content="MAP Solidário">
<meta property="og:description" content="Mobilização · Apoio · Proteção. Veja como ajudar as cidades atingidas no RS.">
<meta property="og:image" content="logo.png">
<meta name="theme-color" content="#5B1F86">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--roxo:#5B1F86;--roxo2:#7B2CA8;--mag:#C2185B;--lar:#F28C28;--ama:#F2B90F;--teal:#14A38B;--teal2:#0E8C77;--azul:#3AA0E8;--bg:#F6F3FA;--tx:#2A1640;--sub:#6E5A86;--linha:#E7DDF1;--crit:#E0245E;--grave:#F28C28;--mod:#F2C21B;--mon:#16A88F}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(78px + env(safe-area-inset-bottom))}
a{color:var(--roxo2)}
svg.lucide{width:1em;height:1em;stroke-width:2;vertical-align:-.15em}
/* ---------- topo ---------- */
.topo{position:sticky;top:0;z-index:1000;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;overflow:hidden;box-shadow:0 1px 0 var(--linha)}
.topo:after{content:"";position:absolute;right:-40px;top:-60px;width:170px;height:110px;background:linear-gradient(120deg,#2BC4B0 0 45%,var(--roxo) 46% 100%);transform:rotate(18deg);border-radius:0 0 0 40px;opacity:.95;pointer-events:none}
.topo .ib{position:relative;z-index:1;background:none;border:0;color:var(--roxo);font-size:30px;padding:6px;cursor:pointer;line-height:0}
.topo .marca{text-align:center;text-decoration:none;color:var(--tx);display:block}
.topo .marca img{height:58px;display:block;margin:0 auto}
.topo .marca span{font-size:.82rem;font-weight:600;letter-spacing:.2px}
.topo .dir{display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.sino{position:relative}
.sino i.ponto{position:absolute;top:6px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--teal);border:2px solid #fff}
.topo .perfil{width:46px;height:46px;border-radius:50%;background:var(--roxo);color:#fff!important;display:grid;place-items:center;font-size:26px!important;box-shadow:0 0 0 3px #fff}
main{max-width:860px;margin:0 auto;padding:10px 12px 20px}
/* ---------- cartões ---------- */
.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #5b1f8614;border:1px solid #f0e9f7}
.hero{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:20px 20px 22px;min-height:230px;background:linear-gradient(115deg,#4A1570 0%,#7B2CA8 55%,#C2185B 100%);background-size:cover;background-position:center;box-shadow:0 8px 24px #5b1f8630}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#3d0f5ee6 0%,#5b1f86b0 45%,#5b1f8620 100%)}
.hero>*{position:relative}
.selo{display:inline-block;background:var(--teal);color:#fff;font-weight:800;border-radius:99px;padding:5px 16px;font-size:.95rem}
.hero h1{font-size:clamp(2rem,8vw,3rem);line-height:1.05;margin:.3em 0 .2em;font-weight:900;letter-spacing:-.5px}
.hero p{margin:0 0 14px;max-width:470px;font-weight:600;font-size:1.02rem}
.btn-borda{display:inline-flex;gap:10px;align-items:center;border:2px solid #fff;color:#fff;background:#ffffff14;border-radius:99px;padding:9px 20px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:20px;margin:12px 0;padding:12px 4px;box-shadow:0 4px 18px #5b1f8614;border:1px solid #f0e9f7}
.stats>div{display:grid;grid-template-columns:auto 1fr;gap:0 7px;align-items:center;padding:2px 8px;border-left:1px solid var(--linha)}
.stats>div:first-child{border-left:0}
.stats i,.stats svg{grid-row:span 2;font-size:30px;color:var(--roxo)}
.stats b{font-size:1.25rem;font-weight:900;line-height:1.1}
.stats small{font-size:.8rem;line-height:1.15;color:var(--tx)}
.stats small em{display:block;font-style:normal;color:var(--sub);font-size:.72rem}
@media (max-width:560px){.stats>div{gap:0 5px;padding:2px 5px}.stats svg{font-size:24px}.stats b{font-size:1.02rem}.stats small{font-size:.7rem}.stats small em{font-size:.62rem}}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr);row-gap:10px}.stats>div:nth-child(3){border-left:0}}
@media (max-width:360px){.stats>div{grid-template-columns:1fr;text-align:center}.stats svg{grid-row:auto;margin:auto}}
/* ---------- mapa ---------- */
.mapacard{display:grid;grid-template-columns:minmax(140px,36%) 1fr;gap:6px;padding:16px 10px 14px 16px;position:relative}
.mapacard h2{margin:0 0 10px}
.legenda svg{flex:0 0 auto}
.legenda div{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:600;font-size:1.02rem;white-space:nowrap}
.legenda hr{border:0;border-top:1px solid var(--linha);margin:10px 0}
.total{text-align:center;font-weight:600}
.mapa{height:300px;border-radius:16px;background:#fbf9fd;z-index:1}
.mapa.grande{height:62vh;min-height:360px}
.mapa-expandir{position:absolute;right:16px;top:14px;z-index:500;background:#fff;border:0;border-radius:10px;box-shadow:0 2px 8px #0002;width:38px;height:38px;display:grid;place-items:center;color:var(--tx);font-size:20px;cursor:pointer;text-decoration:none}
@media (max-width:520px){.mapacard{grid-template-columns:minmax(138px,38%) 1fr;padding-left:12px}.mapacard h2{font-size:1.05rem}.legenda div{font-size:.84rem;gap:4px;margin:6px 0}.mapacard .btn-linha{padding:7px 8px;font-size:.8rem;gap:4px;white-space:nowrap;width:100%}.mapacard .mapa{height:270px}}
@media (max-width:359px){.mapacard{grid-template-columns:1fr}}
.leaflet-control-zoom{border:0!important;box-shadow:0 2px 8px #0002!important;border-radius:10px!important;overflow:hidden}
.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;font-size:20px!important;color:var(--tx)!important}
.leaflet-container{font-family:Nunito,sans-serif;background:#f4f1f8}
.leaflet-tile-pane{filter:grayscale(1) opacity(.55)}
.pino{background:none;border:0}
.pino svg{filter:drop-shadow(0 2px 2px #0003)}
.balao{background:#9A1B4E!important;color:#fff!important;border:2px solid #fff!important;border-radius:12px!important;padding:6px 12px!important;font:800 15px/1.15 Nunito,sans-serif!important;text-align:center;box-shadow:0 4px 12px #0003!important}
.balao small{font-weight:600}
.balao:before{border-top-color:#9A1B4E!important}
.leaflet-popup-content{font-family:Nunito,sans-serif;font-size:14px}
/* ---------- botões ---------- */
.btn{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;background:var(--roxo);color:#fff;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;text-align:center;text-decoration:none;margin:8px 0;cursor:pointer}
.btn.alt{background:#fff;color:var(--roxo);border:2px solid var(--roxo)}
.btn.verde{background:var(--teal)}
.btn.peq{display:inline-flex;width:auto;padding:7px 12px;font-size:.88rem;border-radius:10px;margin:4px 4px 0 0}
.btn.perigo{background:#fff;color:var(--crit);border:2px solid #f3c2d2}
.btn-linha{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--roxo);color:var(--roxo);background:#fff;border-radius:99px;padding:8px 18px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;margin-top:10px;justify-content:center}
h2.titulo{font-size:1.55rem;font-weight:900;color:var(--roxo);margin:22px 4px 4px}
.risco{width:56px;height:5px;border-radius:9px;background:var(--teal);margin:0 4px 12px}
h2{font-size:1.25rem;color:var(--roxo);margin:.1em 0 .5em;font-weight:900}
h3{margin:.6em 0 .3em;color:var(--roxo)}
/* ---------- como ajudar ---------- */
.ajudas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ajudas a{background:linear-gradient(180deg,#fff,#F3EEF9);border:1px solid #ece3f5;border-radius:18px;padding:16px 6px 12px;text-align:center;text-decoration:none;color:var(--roxo);font-weight:800;font-size:1.02rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 4px 14px #5b1f8612}
.ajudas a>svg:first-child{font-size:38px}
.ajudas .seta{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:18px;margin-top:auto}
@media (max-width:520px){.ajudas{grid-template-columns:repeat(2,1fr)}}
/* ---------- necessidades ---------- */
.urg{background:#E5F6F2;border:1px solid #c9ece4;border-radius:20px;padding:14px;margin:14px 0}
.urg h2{display:flex;gap:8px;align-items:center;color:var(--roxo);margin:0 0 10px}
.urg h2 svg{color:var(--crit);font-size:30px}
.urg .linha{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.urg .itens{display:flex;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.urg .it{flex:1;min-width:68px;text-align:center;padding:2px 6px;border-left:1px solid #bfe3db;font-size:.85rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx);text-decoration:none}
.urg .it:first-child{border-left:0}
.urg .it svg{font-size:28px;color:var(--roxo)}
.urg .btn{width:auto;margin:4px 0 4px 8px;padding:12px 18px;border-radius:16px;background:var(--teal);font-size:1.02rem}
@media (max-width:520px){.urg .itens{flex-basis:100%}.urg .btn{width:100%;margin:10px 0 0}.urg .it{min-width:62px;font-size:.78rem}}
/* ---------- transparência ---------- */
.transp{background:linear-gradient(110deg,#4A1570,#7B2CA8);color:#fff;border-radius:20px;padding:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0;box-shadow:0 8px 24px #5b1f8630}
.transp .tt{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.2rem;line-height:1.1;flex:1 1 170px}
.transp .tt svg{font-size:36px}
.transp .nums{display:flex;flex:3 1 330px}
.transp .nums div{flex:1;text-align:center;border-left:1px solid #ffffff40;padding:0 4px;font-size:.78rem;line-height:1.15}
.transp .nums div:first-child{border-left:0}
.transp .nums svg{font-size:20px;display:block;margin:0 auto 2px}
.transp .nums b{display:block;font-size:1.25rem;font-weight:900}
.transp .btn-borda{flex:0 0 auto}
@media (max-width:520px){.transp .btn-borda{width:100%;justify-content:center}}
/* ---------- navegação ---------- */
nav.baixo{position:fixed;bottom:0;left:0;right:0;z-index:1000;display:flex;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 18px #5b1f8618;padding:4px 4px env(safe-area-inset-bottom)}
nav.baixo a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 8px;color:var(--tx);text-decoration:none;font-size:.74rem;text-align:center;line-height:1.1;font-weight:600;position:relative}
nav.baixo a svg{font-size:26px;stroke-width:1.6}
nav.baixo a.on{color:var(--roxo);font-weight:900}
nav.baixo a.on svg{fill:var(--roxo);fill-opacity:.18}
nav.baixo a.on svg.lucide-house{fill-opacity:1}
nav.baixo a.on:after{content:"";position:absolute;bottom:2px;width:38px;height:4px;border-radius:9px;background:var(--teal)}
@media (max-width:440px){nav.baixo a{font-size:.64rem}nav.baixo a svg{font-size:23px}.transp .nums b{font-size:1.05rem}}
@media (min-width:900px){nav.baixo{left:50%;transform:translateX(-50%);max-width:860px}}
/* ---------- menu lateral ---------- */
.veu{position:fixed;inset:0;background:#2a164066;z-index:2000;display:none}
.veu.on{display:block}
.gaveta{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:#fff;z-index:2001;transform:translateX(-105%);transition:transform .2s;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 0 20px;box-shadow:4px 0 24px #0003}
.gaveta.on{transform:none}
.gaveta img{height:52px;margin:0 18px 10px}
.gaveta a{display:flex;gap:12px;align-items:center;padding:12px 20px;color:var(--tx);text-decoration:none;font-weight:700}
.gaveta a svg{color:var(--roxo);font-size:22px}
.gaveta a:hover{background:#f5effb}
.gaveta .sep{border-top:1px solid var(--linha);margin:8px 0}
/* ---------- formulários e listas ---------- */
label.cp{display:block;font-weight:700;font-size:.92rem;margin:10px 0 2px}
label.cp em{color:var(--crit);font-style:normal}
input,textarea,select{width:100%;padding:11px 12px;border:1.5px solid #d9cbe8;border-radius:12px;font:inherit;background:#fff;color:var(--tx)}
textarea{resize:vertical}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:600;margin:6px 0;font-size:.95rem}
.chk input{width:20px;height:20px;flex:0 0 20px;margin-top:1px}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0 10px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:340px){.dupla{grid-template-columns:1fr}}
.aviso{background:#FFF6E5;border:1px solid #F7DDAA;border-radius:14px;padding:10px 12px;font-size:.92rem;margin:8px 0}
.ok{background:#E5F6F2;border:1px solid #bfe3db;border-radius:14px;padding:14px;font-weight:600}
.item{padding:12px 0;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.item small,.mut{color:var(--sub)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;color:#fff;font-size:.78rem;font-weight:800;margin:2px 4px 2px 0;vertical-align:middle}
.chip.cl{background:#efe7f7;color:var(--roxo)}
.filtros{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.filtros button{flex:0 0 auto;border:1.5px solid #d9cbe8;background:#fff;color:var(--roxo);border-radius:99px;padding:7px 14px;font:inherit;font-weight:800;font-size:.9rem;cursor:pointer}
.filtros button.on{background:var(--roxo);color:#fff;border-color:var(--roxo)}
.vazio{color:var(--sub);font-style:italic}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:340px){.grade2{grid-template-columns:1fr}}
.num{background:#F6F1FB;border-radius:16px;padding:12px;text-align:center}
.num b{display:block;font-size:1.5rem;font-weight:900;color:var(--roxo)}
.num small{color:var(--sub);font-weight:600}
.tres .num:nth-child(1) b{color:var(--lar)}.tres .num:nth-child(2) b{color:var(--azul)}.tres .num:nth-child(3) b{color:var(--teal)}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:460px){.tres{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--linha)}
th{color:var(--sub);font-size:.8rem}
.voltar{display:inline-flex;gap:6px;align-items:center;color:var(--roxo);font-weight:800;text-decoration:none;margin:6px 4px}
/* ---------- conversas ---------- */
.chat{max-height:55vh;overflow:auto;background:#FAF7FD;border-radius:14px;padding:8px;margin:8px 0}
.msg{background:#fff;border-radius:12px;padding:8px 10px;margin:6px 0;box-shadow:0 1px 3px #0000000d}
.msg.eu{background:#EFE6FA;margin-left:12%}
.msg.fix{border:2px solid var(--ama)}
.msg small{color:var(--sub);font-size:.75rem}
.msg .acoes a{font-size:.75rem;margin-left:8px}
.enviar{display:flex;gap:8px}
.enviar textarea{flex:1;min-height:46px}
.enviar .btn{width:auto;margin:0}
.abas{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.abas a{flex:0 0 auto;display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:99px;background:#fff;border:1.5px solid #d9cbe8;color:var(--roxo);font-weight:800;text-decoration:none;font-size:.9rem}
.abas a.on{background:var(--roxo);border-color:var(--roxo);color:#fff}
.badge{background:var(--crit);color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem}
.dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.9rem;margin:6px 0}
.dl dt{color:var(--sub);font-weight:700}.dl dd{margin:0}
.carregando{text-align:center;padding:40px;color:var(--sub)}
.oculto{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:12px;z-index:3000;font-weight:700;max-width:90vw;text-align:center}
.rodape{text-align:center;color:var(--sub);font-size:.8rem;margin:22px 0 6px}
</style>
</head>
<body>
<header class="topo">
  <button class="ib" onclick="menu(true)" aria-label="Abrir menu"><i data-lucide="menu"></i></button>
  <a class="marca" href="#inicio"><img src="logo.png" alt="MAP Solidário"><span>Mobilização • Apoio • Proteção</span></a>
  <div class="dir">
    <a class="ib sino" href="#avisos" aria-label="Avisos"><i data-lucide="bell"></i><i class="ponto" id="ponto" hidden></i></a>
    <a class="ib perfil" href="#comunidade" aria-label="Minha área"><i data-lucide="user"></i></a>
  </div>
</header>
<div class="veu" id="veu" onclick="menu(false)"></div>
<aside class="gaveta" id="gaveta" aria-label="Menu"></aside>
<main id="app"><div class="carregando">Carregando…</div></main>
<nav class="baixo" id="nav"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@1.78.0/dist/umd/lucide.min.js"></script>
<script>
// =====================================================================
// CONFIGURAÇÃO — preencha as 4 linhas abaixo (entre as aspas)
// =====================================================================
const CFG = {
  url: 'https://cemlpkbhpndzfccujrdx.supabase.co',
  key: 'sb_publishable_ssfnRWcrMNHfP4K23LfVPQ_wgRYT9Iv',
  termoUrl: '',        // link do termo/cadastro de voluntário no MAP OS (se ficar vazio, o botão não aparece)
  contato: ''          // e-mail de contato do MAP para dúvidas e pedidos de privacidade
};
// =====================================================================

const sb = (CFG.url.startsWith('http') && window.supabase) ? supabase.createClient(CFG.url, CFG.key, {auth:{flowType:'implicit', persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}) : null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = v => (v === null || v === undefined || v === '') ? '—' : Number(v).toLocaleString('pt-BR');
const reais = v => { v = Number(v || 0); return v >= 1e6 ? 'R$ ' + (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mi' : v >= 1e4 ? 'R$ ' + Math.round(v/1e3).toLocaleString('pt-BR') + ' mil' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); };
const reaisCheio = v => Number(v || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const data = d => d ? new Date(d).toLocaleDateString('pt-BR') : '';
const dataHora = d => d ? new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '';
const urlSegura = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
const ico = (nome, extra = '') => `<i data-lucide="${nome}" ${extra}></i>`;
const guardar = (k, v) => { try { localStorage.setItem('mapsol_' + k, v); } catch (e) {} };
const ler = k => { try { return localStorage.getItem('mapsol_' + k); } catch (e) { return null; } };

async function carregar(){
  const m = await sb.from('mobilizacoes').select('*').eq('ativa', true).order('criada', {ascending:false}).limit(1);
  S.mob = m.data?.[0] || null;
  if (S.mob){
    const id = S.mob.id;
    const [c, ne, i, a, ind] = await Promise.all([
      sb.from('cidades').select('*').eq('mobilizacao_id', id).order('nome'),
      sb.from('necessidades').select('*').eq('mobilizacao_id', id).eq('atendida', false).order('atualizado', {ascending:false}),
      sb.from('instituicoes').select('*').eq('mobilizacao_id', id).order('nome'),
      sb.from('avisos').select('*').eq('publico', true).order('criado', {ascending:false}).limit(30),
      sb.rpc('indicadores', {mob:id})
    ]);
    S.cid = c.data || []; S.nec = ne.data || []; S.inst = i.data || []; S.avisos = a.data || []; S.ind = ind.data || {};
  }
  await carregarUsuario();
}
async function carregarUsuario(){
  const {data} = await sb.auth.getSession();
  S.user = data.session?.user || null;
  S.lib = S.user ? ((await sb.from('liberados').select('*').eq('email', S.user.email.toLowerCase())).data || []) : [];
}

function pinoSvg(cor, num, grande){
  const w = grande ? 40 : 30, h = grande ? 52 : 39;
  return `<svg viewBox="0 0 34 44" width="${w}" height="${h}"><path d="M17 1.5C8.4 1.5 1.5 8.3 1.5 16.8c0 11 14.2 24.6 14.8 25.2a1 1 0 0 0 1.4 0c.6-.6 14.8-14.2 14.8-25.2C32.5 8.3 25.6 1.5 17 1.5z" fill="${cor}" stroke="#fff" stroke-width="2.5"/>${num !== '' ? `<text x="17" y="22" text-anchor="middle" font-size="${String(num).length > 2 ? 11 : 15}" font-weight="900" fill="#fff" font-family="Nunito,Arial,sans-serif">${num}</text>` : '<circle cx="17" cy="16.5" r="5.5" fill="#fff"/>'}</svg>`;

function criarMapa(el, opcoes = {}){
  const map = L.map(el, {zoomControl:false, zoomSnap:.25, scrollWheelZoom: !!opcoes.grande, attributionControl:true}).setView([-30.0, -53.3], 6);
  L.control.zoom({position:'bottomright', zoomInTitle:'Aproximar', zoomOutTitle:'Afastar'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'© OpenStreetMap'}).addTo(map);
  const estado = L.polygon(RS.map(p => [p[1], p[0]]), {color:'#0E8C77', weight:2, fillColor:'#18A88F', fillOpacity:.88, interactive:false}).addTo(map);
  map.fitBounds(estado.getBounds(), {paddingTopLeft:[6, opcoes.grande ? 20 : 54], paddingBottomRight:[6, 6]});
  const ajustar = () => estado.setStyle({fillOpacity: map.getZoom() >= 9 ? .12 : map.getZoom() >= 8 ? .45 : .88});
  map.on('zoomend', ajustar);
  map.attributionControl.setPrefix(false);
  const camada = L.layerGroup().addTo(map);
  const desenhar = () => desenharPinos(map, camada, opcoes.cidades || S.cid);
  map.on('zoomend', desenhar); desenhar();
  mapas.push(map);
  return map;
}
function desenharPinos(map, camada, cidades){
  camada.clearLayers();
  const z = map.getZoom(), grupos = [];
  for (const c of cidades){
    if (!GRAV[c.gravidade]) continue;
    if (c.destaque){ grupos.push({g:c.gravidade, itens:[c], destaque:true}); continue; }
    const p = map.project([c.lat, c.lng], z);
    const alvo = grupos.find(g => !g.destaque && g.g === c.gravidade && g.p.distanceTo(p) < 46);
    if (alvo) alvo.itens.push(c); else grupos.push({g:c.gravidade, itens:[c], p});
  }
  for (const g of grupos){
    const lat = g.itens.reduce((a, c) => a + c.lat, 0) / g.itens.length, lng = g.itens.reduce((a, c) => a + c.lng, 0) / g.itens.length;
    const grande = !!g.destaque, cor = g.destaque ? '#B0174F' : GRAV[g.g][1];
    const mk = L.marker([lat, lng], {icon: L.divIcon({className:'pino', html: pinoSvg(cor, g.itens.length, grande), iconSize: grande ? [40,52] : [30,39], iconAnchor: grande ? [20,50] : [15,37], popupAnchor:[0, grande ? -46 : -34]}), zIndexOffset: grande ? 1000 : 0}).addTo(camada);
    if (g.destaque){
      const c = g.itens[0];
      mk.bindTooltip(`${esc(c.nome)}/${esc(c.uf || 'RS')}<br><small>(${c.gravidade === 'critica' ? 'mais afetada' : GRAV[c.gravidade][0].toLowerCase()})</small>`, {permanent:true, direction:'top', offset:[0,-48], className:'balao'});
    }
    if (g.itens.length > 1){
      mk.on('click', () => map.fitBounds(L.latLngBounds(g.itens.map(c => [c.lat, c.lng])), {padding:[40,40], maxZoom:10}));
    } else {
      const c = g.itens[0];
      mk.bindPopup(`<b>${esc(c.nome)}/${esc(c.uf || 'RS')}</b><br><span class="chip" style="background:${GRAV[c.gravidade][1]}">${GRAV[c.gravidade][0]}</span>${c.afetados ? '<br>' + n(c.afetados) + ' pessoas afetadas' : ''}${c.residencias_danos ? '<br>' + n(c.residencias_danos) + ' residências com danos' : ''}<br><a href="#cidade/${c.id}">Ver detalhes</a>`);
    }
  }
}

}

// ---------- construtor de formulários ----------
function campo(f, v = {}){
  const val = f.k.startsWith('d_') ? (v.dados || {})[f.k.slice(2)] : v[f.k];
  const req = f.req ? 'required' : '', star = f.req ? ' <em>*</em>' : '', ph = f.ph ? `placeholder="${esc(f.ph)}"` : '';
  let h;
  if (f.t === 'check') return `<label class="chk"><input type="checkbox" name="${f.k}" ${req} ${val ? 'checked' : ''}> <span>${esc(f.l)}${star}</span></label>`;
  if (f.t === 'checks') return `<label class="cp">${esc(f.l)}${star}</label><div class="chks">${f.opts.map(o => `<label class="chk"><input type="checkbox" name="${f.k}" value="${esc(o[0])}" ${[].concat(val || []).includes(o[0]) ? 'checked' : ''}> <span>${esc(o[1])}</span></label>`).join('')}</div>`;
  if (f.t === 'select') h = `<select name="${f.k}" ${req}>${!f.opts.some(o => o[0] === '') ? `<option value="">${f.req ? 'Selecione' : '—'}</option>` : ''}${f.opts.map(o => `<option value="${esc(o[0])}" ${String(val ?? '') === String(o[0]) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if (f.t === 'textarea') h = `<textarea name="${f.k}" rows="3" ${req} ${ph} maxlength="2000">${esc(val)}</textarea>`;
  else if (f.t === 'file') h = `<input type="file" name="${f.k}" ${f.accept ? `accept="${f.accept}"` : ''}>`;
  else h = `<input type="${f.t || 'text'}" name="${f.k}" ${req} ${ph} value="${esc(val)}" ${f.t === 'number' ? 'step="any" min="0"' : 'maxlength="300"'}>`;
  return `<div ${f.half ? 'class="meio"' : ''}><label class="cp">${esc(f.l)}${star}</label>${h}</div>`;
}
function montarCampos(lista, v){
  let h = '', buf = [];
  const solta = () => { if (buf.length) { h += `<div class="dupla">${buf.join('')}</div>`; buf = []; } };
  for (const f of lista){ if (f.half){ buf.push(campo(f, v)); if (buf.length === 2) solta(); } else { solta(); h += campo(f, v); } }
  solta(); return h;
}
const FORMS = {};
function form(tipo, lista, botao, frente = 'map'){
  FORMS[tipo] = lista;
  return `<form id="f_${tipo}" onsubmit="return enviarCadastro(event,'${tipo}','${frente}')"><input class="oculto" name="site" tabindex="-1" autocomplete="off">${montarCampos(lista)}<button class="btn">${esc(botao)}</button></form>`;
}
function coletar(formEl, lista){
  const fd = new FormData(formEl), o = {}, dados = {};
  for (const f of lista){
    let v;
    if (f.t === 'check') v = !!formEl.elements[f.k]?.checked;
    else if (f.t === 'checks') v = fd.getAll(f.k);
    else if (f.t === 'file') continue;
    else { v = (fd.get(f.k) ?? '').toString().trim(); if (f.t === 'number') v = v === '' ? null : Number(String(v).replace(',', '.')); else if (v === '') v = null; }
    if (f.k.startsWith('d_')){ if (v !== null && !(Array.isArray(v) && !v.length)) dados[f.k.slice(2)] = v; } else o[f.k] = v;
  }
  return {o, dados};
}
async function enviarCadastro(e, tipo, frente){
  e.preventDefault();
  const f = e.target;
  if (f.site.value) return false;
  if (S.enviando) return false;
  const ultimo = Number(ler('ultimo') || 0);
  if (Date.now() - ultimo < 15000){ toast('Aguarde alguns segundos antes de enviar de novo.'); return false; }
  const {o, dados} = coletar(f, FORMS[tipo]);
  const linha = {mobilizacao_id:S.mob?.id || null, tipo, frente, nome:o.nome || dados.empresa || '—', email:o.email ? o.email.toLowerCase() : null, telefone:o.telefone || null, cidade_pais:o.cidade_pais || null, valor:o.valor ?? null, anonimo:!!o.anonimo, consentimento:!!o.consentimento, dados};
  if (o.instituicao_id && o.instituicao_id !== 'outra') linha.instituicao_id = o.instituicao_id;
  if (tipo === 'voluntario' && dados.frentes === 'pet') linha.frente = 'pet';
  S.enviando = true;
  const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Enviando…';
  const {error} = await sb.from('cadastros').insert(linha);
  S.enviando = false;
  if (error){ btn.disabled = false; btn.textContent = 'Tentar de novo'; toast('Não foi possível enviar. Confira os campos e a internet.'); console.error(error); return false; }
  guardar('ultimo', Date.now());
  const msgs = {
    voluntario:`<b>Cadastro recebido! Obrigado por somar.</b><br>A equipe vai falar com você pelo WhatsApp ou e-mail. ${CFG.termoUrl ? `O próximo passo é assinar o termo de voluntariado:<a class="btn" href="${esc(CFG.termoUrl)}" target="_blank" rel="noopener">Assinar o termo de voluntariado</a>` : 'Em seguida você recebe o termo de voluntariado para assinar.'}<br>Depois que a equipe liberar o seu e-mail, você entra na Comunidade pelo ícone de perfil, no alto da página.`,
    oferta:'<b>Oferta registrada!</b><br>A equipe vai combinar com você o destino e a entrega.',
    contribuicao:'<b>Doação registrada!</b><br>Ela entra na transparência como “declarada” e muda de etapa quando a instituição confirmar.',
    empresa:'<b>Recebemos a sua proposta!</b><br>A equipe de parcerias entra em contato em breve.',
    indicacao:'<b>Indicação recebida!</b><br>Obrigado. A equipe vai fazer a abordagem.',
    resgate:'<b>Pedido recebido!</b><br>A equipe do Pet Solidário vai fazer a triagem e falar com você pelo WhatsApp.',
    lar:'<b>Obrigado por abrir a sua casa!</b><br>A equipe do Pet Solidário entra em contato.'
  };
  f.outerHTML = `<div class="ok">${msgs[tipo]}</div><button class="btn alt" onclick="compartilhar()">${ico('share-2')} Chamar mais gente</button>`;
  icones(); return false;
}
async function enviarInforme(e){
  e.preventDefault();

async function compartilhar(){
  const url = location.origin + location.pathname, texto = `MAP Solidário: veja como ajudar ${S.mob?.nome || 'as cidades atingidas no RS'}.`;

  try { await navigator.clipboard.writeText(texto + ' ' + url); toast('Link copiado. É só colar no WhatsApp.'); } catch (e) { prompt('Copie o link:', url); }
}

async function entrar(){
  const email = $('#em').value.trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Digite um e-mail válido.');
  $('#msgLogin').textContent = 'Enviando…';

  if (error){ $('#msgLogin').textContent = /rate|limit|seconds/i.test(error.message) ? 'Muitos pedidos em pouco tempo. Espere um minuto e tente de novo.' : 'Erro: ' + error.message; return; }
  $('#msgLogin').textContent = 'Pronto! Abra o link que enviamos para o seu e-mail (veja também o spam). Se preferir, use o código.';
  $('#passo2').hidden = false;
}
async function conferirCodigo(){
  const email = $('#em').value.trim().toLowerCase(), token = $('#cod').value.trim();
  if (!token) return;
  const {error} = await sb.auth.verifyOtp({email, token, type:'email'});
  if (error) return $('#msgLogin').textContent = 'Código inválido ou vencido. Peça um novo.';
  await carregarUsuario(); render();
}
async function sair(){ await sb.auth.signOut(); S.user = null; S.lib = []; S.grupo = null; location.hash = '#inicio'; render(); }

async function carregarMsgs(rolarFim){

}
async function enviarMsg(){

  const {data: hist} = await sb.from('historico').select('*').order('quando', {ascending:false}).limit(40);
  const m = S.mob || {};
  const AC = {update:'alterou', delete:'apagou', insert:'criou'};
  return `${S.mob ? `<div class="card"><h2>Mobilização ativa</h2><form onsubmit="return salvarMob(event)">
    <label class="cp">Nome (título da capa)</label><input name="nome" value="${esc(m.nome)}" required>
    <label class="cp">Selo verde da capa</label><input name="chamada" value="${esc(m.chamada)}">
    <label class="cp">Região</label><input name="regiao" value="${esc(m.regiao)}">
    <label class="cp">Descrição</label><textarea name="descricao" rows="3">${esc(m.descricao)}</textarea>
    <label class="cp">Imagem de fundo da capa (JPG ou PNG, de preferência larga)</label><input type="file" name="imagem" accept="image/*">
    ${m.imagem_url ? `<label class="chk"><input type="checkbox" name="tirar"> <span>Remover a imagem atual</span></label>` : ''}
    <button class="btn">Salvar</button></form>
    <button class="btn perigo" onclick="encerrarMob()">Encerrar esta mobilização</button></div>` : ''}
  <div class="card"><h2>Nova mobilização</h2><p class="mut">A mobilização ativa mais recente é a que aparece na página inicial.</p><form onsubmit="return novaMob(event)"><label class="cp">Nome <em>*</em></label><input name="nome" required placeholder="Ex.: Enchentes no Vale do Taquari"><label class="cp">Região</label><input name="regiao"><label class="cp">Descrição</label><textarea name="descricao" rows="2"></textarea><button class="btn">Criar mobilização</button></form></div>
  <div class="card"><h2>Histórico de alterações</h2>${(hist || []).map(h => `<div class="item"><small>${dataHora(h.quando)}</small><br><b>${esc(h.quem || 'sistema')}</b> ${AC[h.acao] || h.acao} em <b>${esc(h.tabela)}</b>${h.depois?.nome || h.antes?.nome ? ': ' + esc(h.depois?.nome || h.antes?.nome) : h.depois?.titulo ? ': ' + esc(h.depois.titulo) : ''}</div>`).join('') || '<p class="vazio">Sem alterações registradas.</p>'}</div>`;
}
async function salvarMob(e){
  e.preventDefault(); const f = e.target;
  const o = {nome:f.nome.value.trim(), chamada:f.chamada.value.trim() || null, regiao:f.regiao.value.trim() || null, descricao:f.descricao.value.trim() || null};
  try {
    const arq = f.imagem.files[0];
    if (arq){
      if (arq.size > 5e6) return toast('Imagem muito grande (máx. 5 MB).'), false;
      const p = `capa-${Date.now()}-${arq.name.replace(/[^\w.-]/g, '_')}`;
      const up = await sb.storage.from('imagens').upload(p, arq, {contentType:arq.type});
      if (up.error) throw up.error;
      o.imagem_url = sb.storage.from('imagens').getPublicUrl(p).data.publicUrl;
    } else if (f.tirar?.checked) o.imagem_url = null;
    const {error} = await sb.from('mobilizacoes').update(o).eq('id', S.mob.id);
    if (error) throw error;
    toast('Mobilização atualizada.'); await carregar(); render();
  } catch (er) { toast('Não salvou: ' + er.message); }
  return false;
}
async function novaMob(e){
  e.preventDefault(); const f = e.target;
  const {error} = await sb.from('mobilizacoes').insert({nome:f.nome.value.trim(), regiao:f.regiao.value.trim() || null, descricao:f.descricao.value.trim() || null});
  if (error) return toast(error.message), false;
  toast('Mobilização criada.'); await carregar(); render(); return false;
}
async function encerrarMob(){
  if (!confirm('Encerrar esta mobilização? Ela sai da página inicial (os dados continuam guardados).')) return;
  await sb.from('mobilizacoes').update({ativa:false}).eq('id', S.mob.id); await carregar(); location.hash = '#inicio';
}
// ---------- documentos ----------
const STD = {aguardando:['Aguardando resposta','#F28C28'], respondido:['Respondido','#16A88F'], sem_retorno:['Sem retorno','#8a7a9e']};
async function eqDocumentos(){
  const d = (await sb.from('documentos').select('*').order('criado', {ascending:false})).data || [];
  const mod = d.filter(x => x.tipo === 'modelo'), env = d.filter(x => x.tipo === 'enviado');
  const abrir = (p, t) => p ? `<a href="#" onclick="abrirArq('${esc(p)}');return false">${t}</a>` : '';
  return `<div class="card"><h2>Novo documento</h2><form onsubmit="return novoDoc(event)">
    <label class="cp">Tipo</label><select name="tipo"><option value="modelo">Modelo (ofício, pedido, termo para reutilizar)</option><option value="enviado">Documento enviado (guardar cópia)</option></select>
    <label class="cp">Título <em>*</em></label><input name="titulo" required>
    <label class="cp">Destinatário (para enviados)</label><input name="destinatario">
    <div class="dupla"><div><label class="cp">Data do envio</label><input type="date" name="enviado_em" value="${new Date().toISOString().slice(0, 10)}"></div><div><label class="cp">Arquivo (PDF, Word, imagem)</label><input type="file" name="arquivo"></div></div>
    <label class="cp">Observações</label><textarea name="notas" rows="2"></textarea><button class="btn">Salvar documento</button></form></div>
  <div class="card"><h2>Modelos (${mod.length})</h2>${mod.map(x => `<div class="item"><b>${esc(x.titulo)}</b><br><small>${esc(x.notas || '')}</small><br>${abrir(x.arquivo, 'Abrir arquivo')}</div>`).join('') || '<p class="vazio">Nenhum modelo ainda.</p>'}</div>
  <div class="card"><h2>Enviados (${env.length})</h2>${env.map(x => `<div class="item"><span class="chip" style="background:${STD[x.status][1]}">${STD[x.status][0]}</span><b>${esc(x.titulo)}</b><br><small>Para ${esc(x.destinatario || '—')} · enviado em ${x.enviado_em ? new Date(x.enviado_em + 'T12:00').toLocaleDateString('pt-BR') : '—'}</small>${x.notas ? `<div>${esc(x.notas)}</div>` : ''}<div>${abrir(x.arquivo, 'Cópia enviada')}${x.arquivo_resposta ? ' · ' + abrir(x.arquivo_resposta, 'Resposta recebida') : ''}</div>${x.resposta ? `<div><small><b>Resposta:</b> ${esc(x.resposta)}</small></div>` : ''}
    <select onchange="statusDoc('${x.id}',this.value)" style="margin-top:6px">${Object.keys(STD).map(k => `<option value="${k}" ${k === x.status ? 'selected' : ''}>${STD[k][0]}</option>`).join('')}</select>
    <button class="btn peq alt" onclick="respDoc('${x.id}')">Registrar resposta (texto)</button><label class="cp" style="font-size:.85rem">Anexar arquivo da resposta</label><input type="file" onchange="anexarResp('${x.id}',this)"></div>`).join('') || '<p class="vazio">Nenhum documento enviado registrado.</p>'}</div>`;
}
async function subir(file){
  if (file.size > 20e6) throw new Error('Arquivo maior que 20 MB.');
  const p = crypto.randomUUID() + '-' + file.name.replace(/[^\w.-]/g, '_');
  const {error} = await sb.storage.from('documentos').upload(p, file);
  if (error) throw error; return p;
}
async function novoDoc(e){
  e.preventDefault();
  try {
    const f = e.target, file = f.arquivo.files[0];
    const o = {tipo:f.tipo.value, titulo:f.titulo.value.trim(), destinatario:f.destinatario.value.trim() || null, notas:f.notas.value.trim() || null, enviado_em:f.enviado_em.value || null, mobilizacao_id:S.mob?.id || null, criado_por:S.user.email};
    if (file) o.arquivo = await subir(file);
    const {error} = await sb.from('documentos').insert(o); if (error) throw error;
    toast('Documento salvo.'); render();
  } catch (er) { toast('Não salvou: ' + er.message); }
  return false;
}
async function abrirArq(p){
  const w = window.open('', '_blank');
  const {data, error} = await sb.storage.from('documentos').createSignedUrl(p, 300);
  if (error){ w && w.close(); return toast(error.message); }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}
async function statusDoc(id, v){ const {error} = await sb.from('documentos').update({status:v}).eq('id', id); if (error) toast(error.message); render(); }
async function respDoc(id){ const t = prompt('Resumo da resposta recebida:'); if (!t) return; const {error} = await sb.from('documentos').update({resposta:t, status:'respondido'}).eq('id', id); if (error) toast(error.message); render(); }
async function anexarResp(id, inp){
  const f = inp.files[0]; if (!f) return;
  try { const p = await subir(f); const {error} = await sb.from('documentos').update({arquivo_resposta:p, status:'respondido'}).eq('id', id); if (error) throw error; toast('Resposta anexada.'); render(); }
  catch (er) { toast('Não anexou: ' + er.message); }
}

// =====================================================================
// NAVEGAÇÃO
// =====================================================================
const NAV = [['inicio','Início','house'],['cidades','Cidades','map-pin'],['ajudar','Ajudar','hand-heart'],['pet','Pet Solidário','paw-print'],['transparencia','Transparência','chart-column'],['comunidade','Comunidade','users']];
function icones(){ try { lucide.createIcons(); } catch (e) {} }
function menu(abrir){
  $('#veu').classList.toggle('on', abrir); $('#gaveta').classList.toggle('on', abrir);
  if (abrir) {
    const L = [['#inicio','Início','house'],['#cidades','Cidades atingidas','map-pin'],['#ajudar/voluntario','Seja voluntário','users'],['#ajudar/doacoes','Doações e materiais','package'],['#ajudar/parcerias','Empresas e parcerias','hand-heart'],['#pet','Pet Solidário em Rede','paw-print'],['#ajudar/informe','Informar ocorrência','megaphone'],['#transparencia','Transparência','chart-column'],['#avisos','Avisos','bell'],['#comunidade','Comunidade','message-circle']];
    $('#gaveta').innerHTML = `<img src="logo.png" alt="MAP Solidário">${L.map(x => `<a href="${x[0]}" onclick="menu(false)">${ico(x[2])} ${x[1]}</a>`).join('')}${team() ? `<div class="sep"></div><a href="#equipe" onclick="menu(false)">${ico('settings')} Área da equipe</a>` : ''}<div class="sep"></div><a href="#" onclick="menu(false);compartilhar();return false">${ico('share-2')} Compartilhar</a><a href="#privacidade" onclick="menu(false)">${ico('shield-check')} Privacidade</a>${S.user ? `<a href="#" onclick="menu(false);sair();return false">${ico('log-out')} Sair</a>` : ''}`;
    icones();
  }
}
async function render(){
  clearInterval(chatTimer); limparMapas();
  let [pag, arg] = location.hash.replace(/^#\/?/, '').split('/');
  pag = pag || 'inicio';
  const telas = {inicio, cidades, cidade, ajudar, pet, transparencia, avisos, privacidade, comunidade, equipe};
  if (!telas[pag]) pag = 'inicio';
  let html;
  try { html = await telas[pag](arg); } catch (e) { console.error(e); html = `<div class="card"><h2>Algo deu errado</h2><p class="mut">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Recarregar</button></div>`; }
  $('#app').innerHTML = html;
  const ativo = pag === 'cidade' ? 'cidades' : pag === 'equipe' ? 'comunidade' : pag;
  $('#nav').innerHTML = NAV.map(([k, t, i]) => `<a class="${k === ativo ? 'on' : ''}" href="#${k}">${ico(i)}${t}</a>`).join('');
  icones();
  if (pag === 'inicio' && $('#mapaInicio')) criarMapa('mapaInicio');
  if (pag === 'cidades') criarMapa('mapaCidades', {grande:true});
  if (pag === 'cidade' && $('#mapaCidade')){ const c = S.cid.find(x => x.id === arg); const m = criarMapa('mapaCidade'); if (c) m.setView([c.lat, c.lng], 10); }
  if (pag === 'equipe' && $('#mapaEquipe')){ const m = criarMapa('mapaEquipe', {grande:true}); m.on('click', ev => preencherCoord(ev.latlng.lat, ev.latlng.lng)); }
  if (pag === 'comunidade' && S.grupo && $('#chat')){ carregarMsgs(true); chatTimer = setInterval(() => { if (!document.hidden) carregarMsgs(); }, 5000); }
  const visto = ler('visto');
  $('#ponto').hidden = !(S.avisos.length && (!visto || new Date(S.avisos[0].criado) > new Date(visto)));
}
let ultimaPag = '';
window.addEventListener('hashchange', () => {
  if (/access_token|error_description/.test(location.hash)) return;
  const pag = location.hash.split('/')[0];
  if (pag !== ultimaPag){ S.edit = null; scrollTo(0, 0); }
  ultimaPag = pag; render();
});

(async () => {
  icones();
  if (!sb){ $('#app').innerHTML = '<div class="card"><h2>Falta configurar</h2><p>Preencha as linhas de CONFIGURAÇÃO no começo do script do arquivo index.html (URL e chave do Supabase).</p></div>'; return; }
  const voltouDoLogin = /access_token|error_description|type=magiclink/.test(location.hash);
  if (voltouDoLogin){
    await sb.auth.getSession();
    const erro = /error_description/.test(location.hash);
    history.replaceState(null, '', location.pathname + '#comunidade');
    if (erro) setTimeout(() => toast('O link de acesso venceu ou já foi usado. Peça um novo.'), 600);
  }
  sb.auth.onAuthStateChange((ev, sessao) => {
    const novo = sessao?.user?.email || null;
    if ((ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') && novo !== (S.user?.email || null)) setTimeout(async () => { await carregarUsuario(); render(); }, 0);
  });
  await carregar();
  ultimaPag = location.hash.split('/')[0];
  render();
})();
</script>
</body>
